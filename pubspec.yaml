name: langlearn
description: "Language learning app: video, subtitles, vocabulary, grammar, music lyrics."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  video_player: ^2.9.2
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  http: ^1.3.0
  crypto: ^3.0.6
  collection: ^1.19.1
  file_picker: ^11.0.3
  scrollable_positioned_list: ^0.3.8
  epubx: ^4.0.0
  japanese_word_tokenizer: ^0.0.3
  flutter_markdown: ^0.7.7+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
